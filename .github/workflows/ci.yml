name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go test and migration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: book_test
          POSTGRES_USER: book
          POSTGRES_PASSWORD: book
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U book -d book_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://book:book@localhost:5432/book_test?sslmode=disable
      TEST_DATABASE_URL: postgres://book:book@localhost:5432/book_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: true
      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Apply migrations twice
        run: |
          go run ./cmd/migrate
          go run ./cmd/migrate
      - name: Test with race detector
        run: go test -race -coverprofile=coverage.out ./...

  mobile:
    name: Expo static validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_PUBLIC_API_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.17.1
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Export web QA bundle
        run: pnpm exec expo export --platform web

  container:
    name: Production container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build API and Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: bookgyeol:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
