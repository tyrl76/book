services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: book
      POSTGRES_USER: book
      POSTGRES_PASSWORD: book
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U book -d book"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - book_postgres_data:/var/lib/postgresql/data
      - ./migrations/000001_initial.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./migrations/000002_product_features.sql:/docker-entrypoint-initdb.d/002-product-features.sql:ro
      - ./migrations/000003_groups_presence.sql:/docker-entrypoint-initdb.d/003-groups-presence.sql:ro
      - ./migrations/000004_notification_delivery.sql:/docker-entrypoint-initdb.d/004-notification-delivery.sql:ro
      - ./migrations/000005_launch_safety.sql:/docker-entrypoint-initdb.d/005-launch-safety.sql:ro
      - ./deploy/dev/seed.sql:/docker-entrypoint-initdb.d/006-seed.sql:ro

volumes:
  book_postgres_data:
