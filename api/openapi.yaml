openapi: 3.1.0
info:
  title: 책결 API
  version: 0.8.0
  description: 개인 로컬 계정, 친구·그룹 독서 공유, 기록, 통계, 알림, 계정 삭제와 실시간 운영 센터 기능을 제공하는 현재 Go 서버 계약.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
  - devUserAuth: []
tags:
  - { name: System }
  - { name: Authentication }
  - { name: Account }
  - { name: Catalog }
  - { name: Reading }
  - { name: Social }
  - { name: Groups }
  - { name: Operations }
  - { name: Moderation }
paths:
  /healthz:
    get:
      tags: [System]
      summary: API와 데이터베이스 상태 확인
      security: []
      responses:
        '200':
          description: 정상
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { const: ok }
        '503': { $ref: '#/components/responses/Error' }

  /v1/auth/status:
    get:
      tags: [Authentication]
      summary: 첫 개인 계정 가입 가능 여부
      security: []
      responses:
        '200':
          description: 개인 계정 상태
          content:
            application/json:
              schema:
                type: object
                required: [registrationOpen]
                properties:
                  registrationOpen: { type: boolean }

  /v1/auth/register:
    post:
      tags: [Authentication]
      summary: 최초 개인 계정 생성
      description: local_credentials가 비어 있을 때 한 번만 성공한다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocalRegistration' }
      responses:
        '201':
          description: 생성된 계정과 30일 세션
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocalAuthSession' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/auth/login:
    post:
      tags: [Authentication]
      summary: 개인 계정 로그인
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocalLogin' }
      responses:
        '200':
          description: 새 30일 세션
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocalAuthSession' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /v1/auth/logout:
    post:
      tags: [Authentication]
      summary: 현재 개인 세션 폐기
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Error' }

  /v1/me/bootstrap:
    post:
      tags: [Account]
      summary: 인증 사용자의 서비스 프로필 보장
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname: { type: string, maxLength: 40 }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /v1/me:
    get:
      tags: [Account]
      summary: 내 프로필 조회
      responses:
        '200':
          description: 내 프로필
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '401': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Account]
      summary: 내 프로필과 기본 공개 설정 수정
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfile' }
      responses:
        '200':
          description: 수정된 프로필
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '400': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Account]
      summary: 로그인 계정과 서비스 데이터 삭제
      description: 개인 계정은 PostgreSQL 자격 증명과 세션까지 함께 삭제한다. Supabase 연동 모드에서는 외부 Auth 삭제 실패를 Worker가 재시도한다.
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '202':
          description: 외부 Auth 또는 로컬 삭제 재시도 대기
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { const: pending }
        '401': { $ref: '#/components/responses/Error' }

  /v1/me/storage-status:
    get:
      tags: [Account]
      summary: 내 PostgreSQL 저장 상태와 기록 건수 확인
      responses:
        '200':
          description: 저장 상태
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorageStatus' }
        '401': { $ref: '#/components/responses/Error' }

  /v1/me/stats:
    get:
      tags: [Account]
      summary: 연도별 독서 통계 조회
      parameters:
        - name: year
          in: query
          schema: { type: integer, minimum: 2000, maximum: 2200 }
      responses:
        '200':
          description: 독서 통계
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadingStats' }
        '400': { $ref: '#/components/responses/Error' }

  /v1/me/notifications:
    get:
      tags: [Account]
      summary: 알림 설정 조회
      responses:
        '200':
          description: 알림 설정
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferences' }
    put:
      tags: [Account]
      summary: 알림 설정 전체 교체
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationPreferences' }
      responses:
        '200':
          description: 저장된 알림 설정
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferences' }
        '400': { $ref: '#/components/responses/Error' }

  /v1/me/push-tokens:
    post:
      tags: [Account]
      summary: 기기 푸시 토큰 등록 또는 갱신
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushToken' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Account]
      summary: 내 모든 기기 푸시 토큰 비활성화
      responses:
        '204': { $ref: '#/components/responses/NoContent' }

  /v1/admin/overview:
    get:
      tags: [Operations]
      summary: API 런타임과 PostgreSQL 운영 지표 조회
      security: [{ adminKeyAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AdminIDHeader'
      responses:
        '200':
          description: 현재 운영 현황
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOverview' }
        '401': { $ref: '#/components/responses/Error' }
        '501': { $ref: '#/components/responses/Error' }

  /v1/admin/logs:
    get:
      tags: [Operations]
      summary: 현재 API 프로세스의 최근 로그 조회
      description: 최대 1,000건의 메모리 링버퍼 중 지정한 ID 이후 로그를 반환한다. 서버 재시작 시 버퍼는 초기화된다.
      security: [{ adminKeyAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AdminLogAfter'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
        - $ref: '#/components/parameters/AdminIDHeader'
      responses:
        '200':
          description: 최근 로그
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AdminLogEntry' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /v1/admin/logs/stream:
    get:
      tags: [Operations]
      summary: 인증 헤더 기반 실시간 API 로그 스트림
      description: NDJSON으로 기존 로그와 새 로그를 전송하고 약 10초마다 연결을 종료한다. 클라이언트는 마지막 ID로 즉시 재연결한다.
      security: [{ adminKeyAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AdminLogAfter'
        - $ref: '#/components/parameters/AdminIDHeader'
      responses:
        '200':
          description: log 또는 heartbeat 이벤트의 NDJSON 스트림
          content:
            application/x-ndjson:
              schema:
                type: string
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /v1/admin/reports:
    get:
      tags: [Moderation]
      summary: 신고 큐 조회
      security: [{ adminKeyAuth: [] }]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [all, open, reviewing, resolved, dismissed]
            default: open
        - $ref: '#/components/parameters/AdminLimit'
        - $ref: '#/components/parameters/AdminIDHeader'
      responses:
        '200':
          description: 신고 목록
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AdminReport' }
        '401': { $ref: '#/components/responses/Error' }

  /v1/admin/reports/{reportId}:
    patch:
      tags: [Moderation]
      summary: 신고 기각·숨김·경고·정지·차단 처리
      security: [{ adminKeyAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ReportID'
        - $ref: '#/components/parameters/AdminIDHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveReport' }
      responses:
        '200':
          description: 생성된 감사 작업
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModerationAction' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /v1/admin/hidden-targets/{targetType}/{targetId}/restore:
    post:
      tags: [Moderation]
      summary: 운영자 숨김 대상 복원
      security: [{ adminKeyAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ModerationTargetType'
        - $ref: '#/components/parameters/ModerationTargetID'
        - $ref: '#/components/parameters/AdminIDHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '200':
          description: 생성된 감사 작업
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModerationAction' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/admin/moderation/actions:
    get:
      tags: [Moderation]
      summary: 최근 운영 조치 감사 로그 조회
      security: [{ adminKeyAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AdminLimit'
        - $ref: '#/components/parameters/AdminIDHeader'
      responses:
        '200':
          description: 감사 로그
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ModerationAction' }
        '401': { $ref: '#/components/responses/Error' }

  /v1/me/annual-goal:
    put:
      tags: [Account]
      summary: 연간 완독 목표 설정
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [year, targetBooks]
              properties:
                year: { type: integer, minimum: 2000, maximum: 2200 }
                targetBooks: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/Error' }

  /v1/me/export:
    get:
      tags: [Account]
      summary: 내 서비스 데이터 JSON 내보내기
      responses:
        '200':
          description: bookgyeol-export.json
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /v1/me/reading-presence:
    put:
      tags: [Account]
      summary: 현재 독서 중 상태 시작
      description: 상태는 서버에서 최대 2시간 뒤 만료된다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [readingRunId]
              properties:
                readingRunId: { type: string, format: uuid }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Account]
      summary: 현재 독서 중 상태 종료
      responses:
        '204': { $ref: '#/components/responses/NoContent' }

  /v1/me/weekly-report:
    get:
      tags: [Account]
      summary: 이번 주 독서 동행 리포트
      responses:
        '200':
          description: 주간 리포트
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeeklyReport' }

  /v1/catalog/book-suggestions:
    get:
      tags: [Catalog]
      summary: 입력 중 표시할 도서 제목 추천
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 10, default: 6 }
      responses:
        '200':
          description: 중복을 제거한 도서 제목 목록
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /v1/catalog/books:
    get:
      tags: [Catalog]
      summary: 제목·저자·ISBN 도서 검색
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: page
          in: query
          description: 1부터 시작하는 결과 페이지
          schema: { type: integer, minimum: 1, maximum: 50, default: 1 }
      responses:
        '200':
          description: 검색 결과
          content:
            application/json:
              schema:
                type: object
                required: [items, page, limit, hasNextPage]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Book' }
                  page: { type: integer, minimum: 1 }
                  limit: { type: integer, minimum: 1, maximum: 50 }
                  hasNextPage: { type: boolean }
        '400': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /v1/catalog/books/{isbn}:
    get:
      tags: [Catalog]
      summary: ISBN으로 도서 조회
      parameters:
        - $ref: '#/components/parameters/ISBN'
      responses:
        '200':
          description: 도서
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Book' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/reading-runs:
    get:
      tags: [Reading]
      summary: 내 모든 독서 회차 조회
      responses:
        '200':
          description: 독서 회차
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ReadingRun' }
    post:
      tags: [Reading]
      summary: 카탈로그 도서로 독서 회차 생성
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReadingRun' }
      responses:
        '201':
          description: 생성된 독서 회차
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadingRun' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/reading-runs/manual:
    post:
      tags: [Reading]
      summary: 도서를 직접 입력해 독서 회차 생성
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateManualReadingRun' }
      responses:
        '201':
          description: 생성된 독서 회차
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadingRun' }
        '400': { $ref: '#/components/responses/Error' }

  /v1/reading-runs/{readingRunId}:
    patch:
      tags: [Reading]
      summary: 독서 상태와 공유 정책 수정
      parameters:
        - $ref: '#/components/parameters/ReadingRunID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateReadingRun' }
      responses:
        '200':
          description: 수정된 독서 회차
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadingRun' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Reading]
      summary: 내 책장에서 독서 회차와 연결 기록 제거
      parameters:
        - $ref: '#/components/parameters/ReadingRunID'
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/reading-runs/{readingRunId}/entries:
    get:
      tags: [Reading]
      summary: 독서 회차의 진척 기록 조회
      parameters:
        - $ref: '#/components/parameters/ReadingRunID'
      responses:
        '200':
          description: 진척 기록
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ProgressEntry' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/reading-runs/{readingRunId}/progress:
    post:
      tags: [Reading]
      summary: 진척·메모·독서 시간 기록
      parameters:
        - $ref: '#/components/parameters/ReadingRunID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordProgress' }
      responses:
        '201':
          description: 새 진척 기록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordProgressResult' }
        '200':
          description: 같은 clientOperationId의 멱등 재생
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordProgressResult' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /v1/feed:
    get:
      tags: [Social]
      summary: 관계·차단·공개 범위가 적용된 피드 조회
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 30 }
      responses:
        '200':
          description: 피드
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FeedEvent' }

  /v1/feed-events/{feedEventId}/reaction:
    parameters:
      - $ref: '#/components/parameters/FeedEventID'
    put:
      tags: [Social]
      summary: 피드에 응원 추가
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Social]
      summary: 피드 응원 취소
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/feed-events/{feedEventId}/comments:
    parameters:
      - $ref: '#/components/parameters/FeedEventID'
    get:
      tags: [Social]
      summary: 스포일러 잠금이 적용된 댓글 조회
      responses:
        '200':
          description: 댓글
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FeedComment' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [Social]
      summary: 독서 위치에 고정된 댓글 또는 답글 작성
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateComment' }
      responses:
        '201':
          description: 생성된 댓글
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedComment' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/friends:
    get:
      tags: [Social]
      summary: 친구와 현재 독서 상태 조회
      responses:
        '200':
          description: 친구 목록
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Friend' }

  /v1/friend-invites:
    post:
      tags: [Social]
      summary: 일회용 친구 초대 생성
      responses:
        '201':
          description: 친구 초대
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invite' }

  /v1/friend-invites/{token}/accept:
    post:
      tags: [Social]
      summary: 친구 초대 수락
      parameters:
        - $ref: '#/components/parameters/InviteToken'
      responses:
        '200':
          description: 연결된 친구
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Friend' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/friends/{userId}:
    delete:
      tags: [Social]
      summary: 친구 관계 삭제
      parameters:
        - $ref: '#/components/parameters/UserID'
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/blocks/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserID'
    post:
      tags: [Social]
      summary: 사용자 차단
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
    delete:
      tags: [Social]
      summary: 사용자 차단 해제
      responses:
        '204': { $ref: '#/components/responses/NoContent' }

  /v1/reports:
    post:
      tags: [Social]
      summary: 사용자·피드·댓글 신고 저장
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReport' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/groups:
    get:
      tags: [Groups]
      summary: 내가 속한 그룹 조회
      responses:
        '200':
          description: 그룹 목록
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ReadingGroup' }
    post:
      tags: [Groups]
      summary: 비공개 독서 그룹 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 60 }
      responses:
        '201':
          description: 생성된 그룹
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadingGroup' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/groups/{groupId}/members:
    get:
      tags: [Groups]
      summary: 그룹 구성원과 독서 상태 조회
      parameters:
        - $ref: '#/components/parameters/GroupID'
      responses:
        '200':
          description: 그룹 구성원
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/GroupMember' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/groups/{groupId}/invites:
    post:
      tags: [Groups]
      summary: 그룹 초대 생성
      parameters:
        - $ref: '#/components/parameters/GroupID'
      responses:
        '201':
          description: 그룹 초대
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invite' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/groups/{groupId}/membership:
    delete:
      tags: [Groups]
      summary: 그룹 나가기
      description: 소유자는 그룹을 나갈 수 없다.
      parameters:
        - $ref: '#/components/parameters/GroupID'
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/group-invites/{token}/accept:
    post:
      tags: [Groups]
      summary: 그룹 초대 수락
      parameters:
        - $ref: '#/components/parameters/InviteToken'
      responses:
        '200':
          description: 가입한 그룹
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadingGroup' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque local session or Supabase JWT
    devUserAuth:
      type: apiKey
      in: header
      name: X-User-ID
      description: ALLOW_DEV_AUTH=true인 로컬 개발에서만 허용한다.
    adminKeyAuth:
      type: apiKey
      in: header
      name: X-Admin-Key
      description: 서버 비밀 저장소의 ADMIN_API_KEY와 일치해야 한다.
  parameters:
    ISBN:
      name: isbn
      in: path
      required: true
      schema: { type: string, pattern: '^(?:\d{10}|\d{13})$' }
    ReadingRunID:
      name: readingRunId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FeedEventID:
      name: feedEventId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserID:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    GroupID:
      name: groupId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InviteToken:
      name: token
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReportID:
      name: reportId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ModerationTargetType:
      name: targetType
      in: path
      required: true
      schema:
        type: string
        enum: [user, feed_event, comment]
    ModerationTargetID:
      name: targetId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AdminLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    AdminIDHeader:
      name: X-Admin-ID
      in: header
      required: false
      schema: { type: string, maxLength: 100, default: operator }
    AdminLogAfter:
      name: after
      in: query
      description: 이 로그 ID보다 큰 항목만 반환한다.
      schema: { type: integer, minimum: 0, default: 0 }
  responses:
    NoContent:
      description: 처리 완료
    Error:
      description: 오류 응답
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }

    LocalRegistration:
      type: object
      additionalProperties: false
      required: [email, password, nickname]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 10, maxLength: 72 }
        nickname: { type: string, minLength: 1, maxLength: 40 }

    LocalLogin:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 10, maxLength: 72 }

    LocalAuthUser:
      type: object
      required: [id, email, nickname]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        nickname: { type: string }

    LocalAuthSession:
      type: object
      required: [token, expiresAt, user]
      properties:
        token: { type: string, writeOnly: true }
        expiresAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/LocalAuthUser' }

    StorageStatus:
      type: object
      required: [database, connected, readingRuns, progressEntries, feedEvents, comments, lastSavedAt, checkedAt]
      properties:
        database: { const: PostgreSQL }
        connected: { type: boolean }
        readingRuns: { type: integer, minimum: 0 }
        progressEntries: { type: integer, minimum: 0 }
        feedEvents: { type: integer, minimum: 0 }
        comments: { type: integer, minimum: 0 }
        lastSavedAt: { type: string, format: date-time }
        checkedAt: { type: string, format: date-time }

    Book:
      type: object
      required: [isbn, title, author, source]
      properties:
        isbn: { type: string }
        title: { type: string }
        author: { type: string }
        publisher: { type: string }
        publishedAt: { type: string }
        description: { type: string }
        coverUrl: { type: string, format: uri }
        detailUrl: { type: string, format: uri }
        source: { type: string }
        pageCount: { type: integer, minimum: 1 }

    ReadingRun:
      type: object
      required: [id, title, author, coverColor, status, progressBasis, currentValue, totalValue, normalizedProgress, visibility, progressPrecision, autoShare, runNumber, updatedAt]
      properties:
        id: { type: string, format: uuid }
        isbn:
          type: string
          description: 카탈로그에서 등록한 판본의 ISBN. 직접 등록한 책은 생략된다.
        title: { type: string }
        author: { type: string }
        coverUrl: { type: string, format: uri }
        coverColor: { type: string }
        status: { $ref: '#/components/schemas/ReadingStatus' }
        progressBasis: { $ref: '#/components/schemas/ProgressBasis' }
        currentValue: { type: number, minimum: 0 }
        totalValue: { type: number, exclusiveMinimum: 0 }
        normalizedProgress: { type: integer, minimum: 0, maximum: 10000 }
        visibility: { $ref: '#/components/schemas/Visibility' }
        shareGroupId: { type: string, format: uuid }
        progressPrecision: { $ref: '#/components/schemas/ProgressPrecision' }
        autoShare: { type: boolean }
        runNumber: { type: integer, minimum: 1 }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateReadingRun:
      type: object
      required: [isbn, totalValue]
      properties:
        isbn: { type: string }
        totalValue:
          type: number
          minimum: 0
          maximum: 1000000
          description: 0이면 카탈로그 쪽수를 사용하고, 없으면 퍼센트 기준으로 보정한다.
        progressBasis: { $ref: '#/components/schemas/ProgressBasis' }
        status:
          type: string
          enum: [reading, want_to_read]

    CreateManualReadingRun:
      type: object
      required: [title, totalValue, progressBasis]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        author: { type: string, maxLength: 120 }
        totalValue: { type: number, exclusiveMinimum: 0, maximum: 1000000 }
        progressBasis: { $ref: '#/components/schemas/ProgressBasis' }
        status:
          type: string
          enum: [reading, want_to_read]

    UpdateReadingRun:
      type: object
      minProperties: 1
      properties:
        status: { $ref: '#/components/schemas/ReadingStatus' }
        visibility: { $ref: '#/components/schemas/Visibility' }
        shareGroupId:
          type: string
          format: uuid
          description: visibility=group이면 함께 보내야 한다. 빈 문자열은 그룹 공유 해제다.
        progressPrecision: { $ref: '#/components/schemas/ProgressPrecision' }
        autoShare: { type: boolean }

    RecordProgress:
      type: object
      required: [clientOperationId, currentValue, recordedAt]
      properties:
        clientOperationId: { type: string, format: uuid }
        currentValue: { type: number, minimum: 0 }
        recordedAt: { type: string, format: date-time }
        note: { type: string, maxLength: 280 }
        correction:
          type: boolean
          default: false
          description: 이전 값보다 낮출 때 true가 필요하다.
        durationSeconds: { type: integer, minimum: 0, maximum: 86400 }

    RecordProgressResult:
      type: object
      required: [entryId, currentValue, normalizedProgress, idempotentReplay]
      properties:
        entryId: { type: string, format: uuid }
        currentValue: { type: number }
        normalizedProgress: { type: integer, minimum: 0, maximum: 10000 }
        milestone:
          type: string
          enum: [milestone_25, milestone_50, milestone_75, finished]
        idempotentReplay: { type: boolean }

    ProgressEntry:
      type: object
      required: [id, previousValue, newValue, normalizedProgress, durationSeconds, correction, recordedAt]
      properties:
        id: { type: string, format: uuid }
        previousValue: { type: number }
        newValue: { type: number }
        normalizedProgress: { type: integer, minimum: 0, maximum: 10000 }
        note: { type: string }
        durationSeconds: { type: integer, minimum: 0 }
        correction: { type: boolean }
        recordedAt: { type: string, format: date-time }

    FeedEvent:
      type: object
      required: [id, actorId, actorNickname, title, author, coverColor, type, normalizedProgress, reactionCount, reactedByViewer, commentCount, occurredAt]
      properties:
        id: { type: string, format: uuid }
        actorId: { type: string, format: uuid }
        actorNickname: { type: string }
        title: { type: string }
        author: { type: string }
        coverUrl: { type: string, format: uri }
        coverColor: { type: string }
        type:
          type: string
          enum: [started, milestone_25, milestone_50, milestone_75, finished, shared_note]
        normalizedProgress: { type: integer, minimum: 0, maximum: 10000 }
        note: { type: string }
        reactionCount: { type: integer, minimum: 0 }
        reactedByViewer: { type: boolean }
        commentCount: { type: integer, minimum: 0 }
        groupId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }

    Friend:
      type: object
      required: [userId, nickname, bio, readingNow]
      properties:
        userId: { type: string, format: uuid }
        nickname: { type: string }
        avatarUrl: { type: string, format: uri }
        bio: { type: string }
        currentTitle: { type: string }
        normalizedProgress: { type: integer, minimum: 0, maximum: 10000 }
        readingNow: { type: boolean }

    Invite:
      type: object
      required: [token, deepLink, expiresAt]
      properties:
        token: { type: string, format: uuid }
        deepLink: { type: string }
        expiresAt: { type: string, format: date-time }

    FeedComment:
      type: object
      required: [id, authorId, authorNickname, normalizedAnchor, revealPolicy, locked, createdAt]
      properties:
        id: { type: string, format: uuid }
        authorId: { type: string, format: uuid }
        authorNickname: { type: string }
        parentId: { type: string, format: uuid }
        normalizedAnchor: { type: integer, minimum: 0, maximum: 10000 }
        revealPolicy:
          type: string
          enum: [always, after_position, finished]
        body:
          type: string
          description: locked=true이면 생략된다.
        locked: { type: boolean }
        createdAt: { type: string, format: date-time }

    CreateComment:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 1000 }
        parentId: { type: string, format: uuid }
        revealPolicy:
          type: string
          enum: [always, after_position, finished]
          default: after_position
        normalizedAnchor: { type: integer, minimum: 0, maximum: 10000 }

    CreateReport:
      type: object
      required: [targetType, targetId, reason]
      properties:
        targetType:
          type: string
          enum: [user, feed_event, comment]
        targetId: { type: string, format: uuid }
        reason:
          type: string
          enum: [spoiler, harassment, spam, privacy, other]
        detail: { type: string, maxLength: 1000 }

    ResolveReport:
      type: object
      required: [action, reason, durationHours]
      properties:
        action:
          type: string
          enum: [dismiss, hide, warn, suspend, ban]
        reason: { type: string, minLength: 1, maxLength: 1000 }
        durationHours:
          type: integer
          minimum: 0
          maximum: 8760
          description: suspend에서만 1 이상이며 나머지 조치는 0이다.

    AdminLogEntry:
      type: object
      required: [id, occurredAt, level, message]
      properties:
        id: { type: integer, minimum: 1 }
        occurredAt: { type: string, format: date-time }
        level: { type: string, enum: [debug, info, warn, error] }
        message: { type: string }
        method: { type: string }
        path: { type: string, description: 쿼리 문자열을 제외한 URL 경로 }
        status: { type: integer, minimum: 100, maximum: 599 }
        durationMs: { type: integer, minimum: 0 }
        responseBytes: { type: integer, minimum: 0 }
        detail: { type: string, maxLength: 801 }

    AdminStorageOverview:
      type: object
      required: [users, activeSessions, readingRuns, progressEntries, openReports, pendingOutbox, pendingNotifications, failedNotifications, databaseSizeBytes]
      properties:
        users: { type: integer, minimum: 0 }
        activeSessions: { type: integer, minimum: 0 }
        readingRuns: { type: integer, minimum: 0 }
        progressEntries: { type: integer, minimum: 0 }
        openReports: { type: integer, minimum: 0 }
        pendingOutbox: { type: integer, minimum: 0 }
        pendingNotifications: { type: integer, minimum: 0 }
        failedNotifications: { type: integer, minimum: 0 }
        databaseSizeBytes: { type: integer, minimum: 0 }

    AdminOverview:
      type: object
      required: [status, database, generatedAt, uptimeSeconds, goVersion, goroutines, memoryBytes, storage]
      properties:
        status: { const: ok }
        database: { const: connected }
        generatedAt: { type: string, format: date-time }
        uptimeSeconds: { type: integer, minimum: 0 }
        goVersion: { type: string }
        goroutines: { type: integer, minimum: 1 }
        memoryBytes: { type: integer, minimum: 0 }
        storage: { $ref: '#/components/schemas/AdminStorageOverview' }

    AdminReport:
      type: object
      required: [id, reporterId, reporterNickname, targetType, targetId, reason, detail, status, resolution, createdAt]
      properties:
        id: { type: string, format: uuid }
        reporterId: { type: string, format: uuid }
        reporterNickname: { type: string }
        targetType:
          type: string
          enum: [user, feed_event, comment]
        targetId: { type: string, format: uuid }
        reason: { type: string }
        detail: { type: string }
        status:
          type: string
          enum: [open, reviewing, resolved, dismissed]
        resolution: { type: string }
        createdAt: { type: string, format: date-time }
        reviewedAt: { type: string, format: date-time }
        reviewedBy: { type: string }

    ModerationAction:
      type: object
      required: [id, operatorId, action, targetType, targetId, reason, createdAt]
      properties:
        id: { type: string, format: uuid }
        reportId: { type: string, format: uuid }
        operatorId: { type: string }
        action:
          type: string
          enum: [dismiss, hide, restore, warn, suspend, ban, revoke_sanction]
        targetType:
          type: string
          enum: [user, feed_event, comment]
        targetId: { type: string, format: uuid }
        subjectUserId: { type: string, format: uuid }
        reason: { type: string }
        createdAt: { type: string, format: date-time }

    Profile:
      type: object
      required: [userId, nickname, bio, defaultVisibility, progressPrecision, friendCount]
      properties:
        userId: { type: string, format: uuid }
        nickname: { type: string }
        avatarUrl: { type: string, format: uri }
        bio: { type: string }
        defaultVisibility: { $ref: '#/components/schemas/Visibility' }
        progressPrecision: { $ref: '#/components/schemas/ProgressPrecision' }
        friendCount: { type: integer, minimum: 0 }

    UpdateProfile:
      type: object
      minProperties: 1
      properties:
        nickname: { type: string, minLength: 1, maxLength: 40 }
        bio: { type: string, maxLength: 160 }
        defaultVisibility: { $ref: '#/components/schemas/Visibility' }
        progressPrecision: { $ref: '#/components/schemas/ProgressPrecision' }

    DailyReading:
      type: object
      required: [date, pages, durationSeconds, entries]
      properties:
        date: { type: string, format: date }
        pages: { type: number, minimum: 0 }
        durationSeconds: { type: integer, minimum: 0 }
        entries: { type: integer, minimum: 0 }

    ReadingStats:
      type: object
      required: [year, reading, wantToRead, paused, finished, dnf, pagesRead, durationSeconds, currentStreakDays, longestStreakDays, annualGoalBooks, annualFinishedBooks, calendar]
      properties:
        year: { type: integer }
        reading: { type: integer, minimum: 0 }
        wantToRead: { type: integer, minimum: 0 }
        paused: { type: integer, minimum: 0 }
        finished: { type: integer, minimum: 0 }
        dnf: { type: integer, minimum: 0 }
        pagesRead: { type: number, minimum: 0 }
        durationSeconds: { type: integer, minimum: 0 }
        currentStreakDays: { type: integer, minimum: 0 }
        longestStreakDays: { type: integer, minimum: 0 }
        annualGoalBooks: { type: integer, minimum: 0 }
        annualFinishedBooks: { type: integer, minimum: 0 }
        calendar:
          type: array
          items: { $ref: '#/components/schemas/DailyReading' }

    NotificationPreferences:
      type: object
      required: [pushEnabled, friendRequests, comments, milestones, dailyDigest]
      properties:
        pushEnabled: { type: boolean }
        friendRequests: { type: boolean }
        comments: { type: boolean }
        milestones: { type: boolean }
        dailyDigest: { type: boolean }
        quietStart:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        quietEnd:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'

    PushToken:
      type: object
      required: [platform, token]
      properties:
        platform:
          type: string
          enum: [ios, android, web]
        token: { type: string, minLength: 10, maxLength: 4096 }

    ReadingGroup:
      type: object
      required: [id, name, role, memberCount, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role:
          type: string
          enum: [owner, member]
        memberCount: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }

    GroupMember:
      type: object
      required: [userId, nickname, role, readingNow]
      properties:
        userId: { type: string, format: uuid }
        nickname: { type: string }
        role:
          type: string
          enum: [owner, member]
        currentTitle: { type: string }
        normalizedProgress: { type: integer, minimum: 0, maximum: 10000 }
        readingNow: { type: boolean }

    WeeklyReport:
      type: object
      required: [weekStart, weekEnd, connectedReadingDays, activeFriends, friendUpdates, reactionsSent, reactionsReceived, myDurationSeconds, myFinishedBooks]
      properties:
        weekStart: { type: string, format: date }
        weekEnd: { type: string, format: date }
        connectedReadingDays: { type: integer, minimum: 0 }
        activeFriends: { type: integer, minimum: 0 }
        friendUpdates: { type: integer, minimum: 0 }
        reactionsSent: { type: integer, minimum: 0 }
        reactionsReceived: { type: integer, minimum: 0 }
        myDurationSeconds: { type: integer, minimum: 0 }
        myFinishedBooks: { type: integer, minimum: 0 }

    ReadingStatus:
      type: string
      enum: [want_to_read, reading, paused, finished, dnf]
    ProgressBasis:
      type: string
      enum: [pages, percent, audio_seconds]
    Visibility:
      type: string
      enum: [private, friends, group, public]
    ProgressPrecision:
      type: string
      enum: [hidden, milestone, exact]
